        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {

            backdrop-filter: saturate(180%) blur(20px);

        }

        /* Smooth inputs */
        input, select, textarea {
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0071e3 !important;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15) !important;
        }

        /* Apple button style */
        .apple-btn {
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 980px;
            padding: 12px 24px;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .apple-btn:hover { background: #0077ed; }
        .apple-btn:active { transform: scale(0.98); }
        .apple-btn:disabled { background: #d2d2d7; cursor: not-allowed; }

        /* ===== ESTILOS DE IMPRESSÃO ===== */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                background-color: white !important;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                display: block !important;
                position: static !important;
            }
            .print-area .a4-page {
                width: 210mm;
                height: 297mm;
                padding: 20mm;
                margin: 0;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
                page-break-inside: avoid;
                background: white;
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .print-area .a4-page:last-child {
                page-break-after: auto;
            }
        }

        @media screen {
            .print-area {
                display: none !important;
            }
        }

        /* Estilo da página na tela (Preview) */
        .a4-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 20mm;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            border-radius: 18px;
            margin: 0 auto 2rem auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Campos de controle especial */
        .box-controle {
            border: 1px solid #1d1d1f;
            padding: 8px;
            font-size: 10px;
            line-height: 1.4;
        }

        /* Cabeçalho por tipo de receita — cores ANVISA */
        .rx-header-A    { background: #fef9c3; border-bottom: 3px solid #ca8a04; }   /* Amarela — Lista A  */
        .rx-header-B    { background: #dbeafe; border-bottom: 3px solid #1d4ed8; }   /* Azul    — Lista B  */
        .rx-header-C    { background: #f5f5f7; border-bottom: 2px solid #6b7280; }   /* Branca  — Especial */

        /* Fundo de página colorido para receitas A e B (impressão) */
        @media print {
            .rx-page-A { background: #fefce8 !important; }
            .rx-page-B { background: #eff6ff !important; }
        }

        /* Campos de identificação — Receita Especial */
        .rx-id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1.5px solid #1d1d1f; font-size: 9px; }
        .rx-id-grid .cell { border: 0.5px solid #9ca3af; padding: 4px 6px; min-height: 22px; }
        .rx-id-grid .cell-label { font-weight: 600; font-size: 8px; color: #374151; display: block; margin-bottom: 1px; }

        /* Selo de assinatura */
        .rx-seal {
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fbfbfd;
        }

        const getTipoReceita = (meds) => {
            const tipos = meds.filter(m => m.name && m.name.trim() && m.tipoReceita).map(m => m.tipoReceita);
            if (tipos.includes('A'))  return 'A';
            if (tipos.includes('B1')) return 'B1';
            if (tipos.includes('B2')) return 'B2';
            if (tipos.includes('C1')) return 'C1';

            id: `${med.id}_${i}`,
            baseId: med.id,
            categoria: med.categoria,
            principioAtivo: med.principioAtivo,
            nomeComercial: med.nomeComercial,
            apresentacao: ap,
            isControlled: med.isControlled,
          }))
        );

        const searchAnvisaMedications = (query) => {
            if (!query || query.length < 2) return [];
            const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const matched = ANVISA_MEDICATIONS.filter(med => {
                const fields = [med.principioAtivo, med.nomeComercial, med.apresentacao, med.categoria]
                    .join(' ').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return fields.includes(q);
            });
            // Retorna um por medicamento base (agrupa apresentações)
            const seen = new Set();
            return matched.filter(m => {
                if (seen.has(m.baseId)) return false;
                seen.add(m.baseId);
                return true;
            }).slice(0, 20);

        const saveToHistory = (patient, medications, freeTexts) => {
            if (!patient.name.trim()) return;
            const all = loadAllHistory();
            const key = getPatientKey(patient);
            if (!all[key]) all[key] = { patient: { ...patient }, prescriptions: [] };
            all[key].patient = { ...patient };
            const meds = medications.filter(m => m.name.trim());
            if (meds.length === 0 && freeTexts.filter(f => f.content.trim()).length === 0) return;
            all[key].prescriptions.unshift({
                id: Date.now(),
                date: new Date().toLocaleDateString('pt-BR'),
                dateIso: new Date().toISOString(),
                medications: meds,
                freeTexts: freeTexts.filter(f => f.content.trim()),
            });
            // Manter máximo 50 por paciente
            all[key].prescriptions = all[key].prescriptions.slice(0, 50);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(all));

            if (!patient.name.trim()) return [];

            const key = getPatientKey(patient);
            return all[key] ? all[key].prescriptions : [];

        // ========================================
        // Lógica de Geração de Páginas
        // ========================================
        const generatePages = (medications, freeTextBlocks, separatePrescriptions) => {
            const validMeds = medications.filter(m => m.name.trim() !== '');
            const validFreeTexts = (freeTextBlocks || []).filter(ft => ft.content.trim() !== '');
            const pages = [];

            if (validMeds.length === 0 && validFreeTexts.length === 0) {
                pages.push({
                    id: 'empty',
                    isControlled: false,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: [],
                    freeTexts: [],
                    isEmpty: true
                });
                return pages;
            }

            // Agrupa por: controlado/não-controlado × com data/sem data
            const groupKeys = [];
            validMeds.forEach(med => {
                const key = `${med.isControlled ? 'C' : 'N'}_${med.hideDate ? 'H' : 'D'}`;
                if (!groupKeys.includes(key)) groupKeys.push(key);
            });

            let pageIdCounter = 0;

            // Função para dividir array em chunks
            const chunkArray = (arr, size) => {
                const chunks = [];
                for (let i = 0; i < arr.length; i += size) {
                    chunks.push(arr.slice(i, i + size));
                }
                return chunks;
            };

            groupKeys.forEach(key => {
                const isControlled = key.startsWith('C');
                const hideDate = key.endsWith('H');

                const groupMeds = validMeds.filter(
                    m => m.isControlled === isControlled && m.hideDate === hideDate
                );

                if (groupMeds.length === 0) return;

                // Agrupa por tipoReceita dentro de controlados
                const tipoGrupos = isControlled
                    ? [...new Set(groupMeds.map(m => m.tipoReceita || 'C1'))]
                    : [null];

                tipoGrupos.forEach(tipoReceita => {
                    const tipoMeds = isControlled
                        ? groupMeds.filter(m => (m.tipoReceita || 'C1') === tipoReceita)
                        : groupMeds;

                    if (tipoMeds.length === 0) return;

                    const maxCopies = Math.max(...tipoMeds.map(m => Math.max(1, parseInt(m.copies) || 1)));

                    for (let copyNum = 1; copyNum <= maxCopies; copyNum++) {
                        const medsForCopy = tipoMeds.filter(m => (Math.max(1, parseInt(m.copies) || 1)) >= copyNum);
                        if (medsForCopy.length === 0) continue;

                        let maxPerPage;
                        if (separatePrescriptions) {
                            maxPerPage = 1;
                        } else if (isControlled) {
                            maxPerPage = 3;
                        } else {
                            maxPerPage = medsForCopy.length;
                        }

                        const chunks = chunkArray(medsForCopy, maxPerPage);

                        chunks.forEach(chunk => {
                            const chunkTipo = chunk[0]?.tipoReceita || tipoReceita;
                            const numVias   = chunkTipo ? (TIPO_RECEITA[chunkTipo]?.vias || 2) : 2;
                            if (isControlled) {
                                for (let via = 1; via <= numVias; via++) {
                                    pages.push({
                                        id: `page-${pageIdCounter++}`,
                                        isControlled: true,
                                        tipoReceita: chunkTipo,
                                        hideDate,
                                        via,
                                        copyIndex: copyNum,
                                        totalCopies: maxCopies,
                                        meds: chunk,
                                        freeTexts: [],
                                        isEmpty: false
                                    });
                                }
                            } else {
                                pages.push({
                                    id: `page-${pageIdCounter++}`,
                                    isControlled: false,
                                    tipoReceita: null,
                                    hideDate,
                                    via: null,
                                    copyIndex: copyNum,
                                    totalCopies: maxCopies,
                                    meds: chunk,
                                    freeTexts: [],
                                    isEmpty: false
                                });
                            }
                        });
                    }
                });
            });

            // Cada texto livre em uma página separada
            validFreeTexts.forEach(ft => {
                pages.push({
                    id: `page-freetext-${pageIdCounter++}`,
                    isControlled: false,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: [],
                    freeTexts: [ft],
                    isEmpty: false
                });
            });

            return pages;
        };

        // ========================================
        // Componente de Busca de Medicamento (Typeahead)
        // ========================================
        const MedicationSearch = ({ onSelect }) => {

                                <button key={med.id} onClick={() => handleSelectBase(med)}
                                    className="w-full text-left px-4 py-3 transition-colors"

                                    </div>
                                    <p style={{ fontSize: '10px', color: '#86868b', marginTop: '2px', paddingLeft: '24px' }}>{med.categoria}</p>

                                    </div>
                                    {apList.map((ap, i) => (

                                        </button>

                            )}
                        </div>

        // ========================================
        // Componente de Assinatura Digital
        // ========================================
        const SignaturePad = ({ onSave, onClear, existingSignature }) => {
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [hasDrawn, setHasDrawn] = React.useState(false);
            const lastPosRef = React.useRef({ x: 0, y: 0 });

            const getPos = (e, canvas) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                if (e.touches) {
                    return {
                        x: (e.touches[0].clientX - rect.left) * scaleX,
                        y: (e.touches[0].clientY - rect.top) * scaleY
                    };
                }
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                const pos = getPos(e, canvas);
                lastPosRef.current = pos;
                setIsDrawing(true);
                setHasDrawn(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e, canvas);
                ctx.beginPath();
                ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#1d1d1f';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                lastPosRef.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleSave = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                onSave(dataUrl);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setHasDrawn(false);
                onClear();
            };

            return (
                <div>
                    <div style={{ border: '1px solid #d2d2d7', borderRadius: '12px', overflow: 'hidden', background: '#fff', marginBottom: '8px' }}>
                        <canvas
                            ref={canvasRef}
                            width={480}
                            height={120}
                            style={{ display: 'block', width: '100%', height: '120px', cursor: 'crosshair', touchAction: 'none' }}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                        />
                    </div>
                    <div style={{ display: 'flex', gap: '8px' }}>
                        <button
                            onClick={handleSave}
                            disabled={!hasDrawn}
                            className="flex-1 py-2 rounded-xl text-xs font-medium transition-all"
                            style={{ background: hasDrawn ? '#0071e3' : '#d2d2d7', color: '#fff', border: 'none', cursor: hasDrawn ? 'pointer' : 'not-allowed' }}
                        >
                            Salvar Assinatura
                        </button>
                        <button
                            onClick={handleClear}
                            className="flex-1 py-2 rounded-xl text-xs font-medium transition-all"
                            style={{ background: '#f5f5f7', color: '#e34040', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                        >
                            Limpar
                        </button>
                    </div>
                    {existingSignature && (
                        <div style={{ marginTop: '8px', padding: '8px', background: '#f0fdf4', borderRadius: '8px', border: '1px solid #bbf7d0' }}>
                            <p style={{ fontSize: '11px', color: '#166534', fontWeight: '500' }}>✓ Assinatura digital salva</p>
                        </div>
                    )}
                </div>
            );
        };

                            </div>

                </div>

        // ========================================

        const PrescriptionSeal = ({ rxId, doctor, patient, date, signed, birdIdSigned }) => {

            useEffect(() => {

                }
            }, [qrText]);

            return (
                <div className="rx-seal" style={{ marginTop: '12px', fontSize: '9px' }}>
                    <canvas ref={canvasRef} width={72} height={72} style={{ borderRadius: '4px' }} />

                        </p>
                        <p style={{ color: '#6e6e73' }}>ID Prescrição: <strong>{rxId}</strong></p>
                        <p style={{ color: '#6e6e73' }}>Médico: {doctor.name} | {doctor.crm}</p>
                        <p style={{ color: '#6e6e73' }}>Emitido em: {date}</p>
                        <p style={{ color: '#86868b', marginTop: '2px' }}>Escaneie o QR Code para verificar autenticidade</p>
                    </div>
                </div>
            );
        };

        // ========================================
        // Componente Bird ID — OAuth2 PKCE via iframe proxy
        // ========================================
        const BirdIDPanel = ({ onSigned, onClose, rxId, prescriptionText }) => {
            const [clientId, setClientId] = useState(() => localStorage.getItem('birdid_client_id') || '');
            const [token, setToken]       = useState(() => sessionStorage.getItem('birdid_token') || null);
            const [status, setStatus]     = useState('idle');
            const [message, setMessage]   = useState('');

            const REDIRECT_URI = window.location.href.split('?')[0];
            const AUTH_URL     = 'https://auth.birdid.com.br/auth/realms/birdid-cloud/protocol/openid-connect/auth';
            const TOKEN_URL    = 'https://auth.birdid.com.br/auth/realms/birdid-cloud/protocol/openid-connect/token';

            // Processar callback OAuth2 que chega nos params da URL
            useEffect(() => {
                const params  = new URLSearchParams(window.location.search);
                const code    = params.get('birdid_code');
                const state   = params.get('birdid_state');
                const saved   = sessionStorage.getItem('birdid_state');
                const verifier= sessionStorage.getItem('birdid_verifier');
                const cid     = localStorage.getItem('birdid_client_id') || '';
                if (code && state === saved && verifier && cid) {
                    setStatus('connecting');
                    setMessage('Trocando código pelo token…');
                    fetch(TOKEN_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            grant_type: 'authorization_code', client_id: cid,
                            redirect_uri: REDIRECT_URI, code, code_verifier: verifier
                        })
                    }).then(r => r.json()).then(data => {
                        sessionStorage.removeItem('birdid_state');
                        sessionStorage.removeItem('birdid_verifier');
                        window.history.replaceState({}, '', REDIRECT_URI);
                        if (data.access_token) {
                            sessionStorage.setItem('birdid_token', data.access_token);
                            setToken(data.access_token);
                            setStatus('connected');
                            setMessage('✓ Autenticado com sucesso! Clique em "Assinar" para assinar o documento.');
                        } else {
                            setStatus('error');
                            setMessage(`Erro: ${data.error_description || 'token não recebido'}`);
                        }
                    }).catch(e => {
                        setStatus('error');
                        setMessage('Erro de rede ao trocar token. O Bird ID exige CORS habilitado ou servidor proxy.');
                    });
                }
            }, []);

            const generatePKCE = async () => {
                const arr = new Uint8Array(32);
                crypto.getRandomValues(arr);
                const verifier  = btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
                const encoded   = new TextEncoder().encode(verifier);
                const digest    = await crypto.subtle.digest('SHA-256', encoded);
                const challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
                return { verifier, challenge };
            };

            const handleConnect = async () => {
                if (!clientId.trim()) { setMessage('Informe o Client ID.'); return; }
                localStorage.setItem('birdid_client_id', clientId);
                const { verifier, challenge } = await generatePKCE();
                const state = Math.random().toString(36).slice(2);
                sessionStorage.setItem('birdid_state', state);
                sessionStorage.setItem('birdid_verifier', verifier);
                // Parâmetros com prefixo birdid_ para não conflitar com outros sistemas
                const cbUrl = `${REDIRECT_URI}?birdid_code=CODE&birdid_state=${state}`;
                const url = `${AUTH_URL}?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=openid+sign&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
                window.location.href = url;
            };

            const handleSign = async () => {
                if (!token) return;
                // Assinar o texto da prescrição via API Bird ID
                setStatus('signing');
                setMessage('Enviando documento para assinatura Bird ID…');
                try {
                    const encoder = new TextEncoder();
                    const data    = encoder.encode(prescriptionText);
                    const hashBuf = await crypto.subtle.digest('SHA-256', data);
                    const hash    = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
                    // Chamar API de assinatura Bird ID
                    const res = await fetch('https://api.birdid.com.br/v0/oauth/sign', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hash, hash_algorithm: 'SHA256', alias: rxId })
                    });
                    if (res.ok) {
                        setStatus('signed');
                        setMessage('✓ Documento assinado com ICP-Brasil via Bird ID!');
                        onSigned();
                    } else {
                        const err = await res.json().catch(() => ({}));
                        setStatus('error');
                        setMessage(`Erro na assinatura: ${err.message || res.status}`);
                    }
                } catch (e) {
                    setStatus('error');
                    setMessage('Erro de conexão. O Bird ID pode exigir servidor proxy para esta operação.');
                }
            };

            const handleDisconnect = () => {
                sessionStorage.removeItem('birdid_token');
                setToken(null); setStatus('idle'); setMessage('');
            };

            return (
                <div style={{ padding: '16px', background: '#f0f7ff', borderRadius: '14px', border: '1px solid #bfdbfe', marginTop: '8px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                        <p style={{ fontWeight: '700', fontSize: '13px', color: '#1e40af' }}>🔐 Assinatura Bird ID — ICP-Brasil</p>
                        <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6e6e73', fontSize: '16px' }}>✕</button>
                    </div>
                    {token ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            <p style={{ fontSize: '12px', color: '#166534', fontWeight: '600' }}>✓ Autenticado no Bird ID</p>
                            {status !== 'signed' && (
                                <button onClick={handleSign} disabled={status === 'signing'}
                                    style={{ fontSize: '13px', fontWeight: '600', color: '#fff', background: status === 'signing' ? '#93c5fd' : '#1d4ed8', border: 'none', borderRadius: '10px', padding: '10px', cursor: 'pointer' }}>
                                    {status === 'signing' ? 'Assinando…' : '🔏 Assinar Prescrição com Bird ID'}
                                </button>
                            )}
                            {message && <p style={{ fontSize: '11px', color: status === 'error' ? '#e34040' : status === 'signed' ? '#166534' : '#1e40af' }}>{message}</p>}
                            <button onClick={handleDisconnect} style={{ fontSize: '11px', color: '#e34040', background: 'none', border: '1px solid #fca5a5', borderRadius: '8px', padding: '4px 10px', cursor: 'pointer', alignSelf: 'flex-start' }}>Desconectar</button>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            <p style={{ fontSize: '11px', color: '#374151', lineHeight: '1.5' }}>
                                Entre no <strong>birdid.com.br</strong>, crie um aplicativo OAuth2 e cole o <strong>Client ID</strong> abaixo.<br/>
                                <span style={{ color: '#6b7280' }}>Redirect URI a configurar: <code style={{ fontSize: '10px', background: '#e0f2fe', padding: '1px 4px', borderRadius: '4px' }}>{REDIRECT_URI}</code></span>
                            </p>
                            <input type="text" placeholder="Client ID do Bird ID" value={clientId} onChange={e => setClientId(e.target.value)}
                                style={{ fontSize: '12px', padding: '8px 10px', borderRadius: '8px', border: '1px solid #93c5fd', outline: 'none', background: '#fff' }} />
                            <button onClick={handleConnect}
                                style={{ fontSize: '12px', fontWeight: '600', color: '#fff', background: '#1d4ed8', border: 'none', borderRadius: '10px', padding: '10px', cursor: 'pointer' }}>
                                Autenticar com Bird ID →
                            </button>
                            {message && <p style={{ fontSize: '11px', color: status === 'error' ? '#e34040' : '#374151' }}>{message}</p>}
                            {status === 'connecting' && <p style={{ fontSize: '11px', color: '#1e40af' }}>Processando autenticação…</p>}
                        </div>
                    )}
                </div>
            );
        };

        // ========================================
        // App Principal
        // ========================================
        const App = () => {
            const [doctor, setDoctor] = useState({
                name: 'Dr. Andrey Rocca',
                crm: 'CRM-DF',
                specialty: 'Médico Psiquiatra'
            });

            const [selectedClinicId, setSelectedClinicId] = useState('ANDREY');
            const [city, setCity] = useState('Brasília');

            const [patient, setPatient] = useState({
                name: '',
                cpf: '',
                address: ''
            });

            const [medications, setMedications] = useState([
                { id: 1, route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 }
            ]);

            const [freeTexts, setFreeTexts] = useState([]);

            const [showDoctorSettings, setShowDoctorSettings] = useState(false);
            const [separatePrescriptions, setSeparatePrescriptions] = useState(false);
            const [signatureDataUrl, setSignatureDataUrl] = useState(null);
            const [showSignaturePad, setShowSignaturePad] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showBirdID, setShowBirdID] = useState(false);
            const [birdIdSigned, setBirdIdSigned] = useState(false);
            const [rxId] = useState(() => `RX${Date.now().toString(36).toUpperCase()}`);

            const hasControlled   = medications.some(m => m.isControlled && m.name.trim());
            const tipoReceitaAtual = getTipoReceita(medications);
            const prescriptionText = medications.filter(m=>m.name.trim()).map(m=>`${m.name}: ${m.instructions}`).join('\n');

            const clinic = CLINICS[selectedClinicId];

            // Gerar páginas com useMemo para evitar recalcular a cada render
            const pages = useMemo(() => generatePages(medications, freeTexts, separatePrescriptions), [medications, freeTexts, separatePrescriptions]);

            // Páginas para impressão (exclui vazias)
            const printPages = useMemo(() => pages.filter(p => !p.isEmpty), [pages]);

            const addMedication = useCallback(() => {
                setMedications(prev => [...prev, { 
                    id: Date.now(), route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 
                }]);
            }, []);

            const removeMedication = useCallback((id) => {
                setMedications(prev => prev.filter(m => m.id !== id));
            }, []);

            const addFreeText = useCallback(() => {

            }, []);

            const removeFreeText = useCallback((id) => {
                setFreeTexts(prev => prev.filter(ft => ft.id !== id));
            }, []);

            const updateFreeText = useCallback((id, field, value) => {
                setFreeTexts(prev => prev.map(ft => ft.id === id ? { ...ft, [field]: value } : ft));
            }, []);

            const updateMedication = useCallback((id, field, value) => {
                setMedications(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            }, []);

            // Mover medicamento na lista
            const moveMedication = useCallback((id, direction) => {
                setMedications(prev => {
                    const idx = prev.findIndex(m => m.id === id);
                    if (idx < 0) return prev;
                    const newIdx = idx + direction;
                    if (newIdx < 0 || newIdx >= prev.length) return prev;
                    const copy = [...prev];
                    [copy[idx], copy[newIdx]] = [copy[newIdx], copy[idx]];
                    return copy;
                });
            }, []);

            const handlePrint = () => {
                saveToHistory(patient, medications, freeTexts);
                window.print();
            };

            // Adicionar medicamento da busca psiquiátrica
            const handleAddFromSearch = useCallback((med) => {
                const medName = `${med.principioAtivo} (${med.nomeComercial}) - ${med.apresentacao}`;
                setMedications(prev => {
                    const withoutEmpty = prev.filter(m => m.name.trim() !== '');
                    return [...withoutEmpty, {
                        id: Date.now(), route: 'Uso Oral', name: medName,

            // Carregar prescrição do histórico
            const handleLoadFromHistory = useCallback((rx) => {

                setFreeTexts((rx.freeTexts || []).map(f => ({ ...f, id: Date.now() + Math.random() })));

            // Adicionar template de texto livre
            const handleAddTemplate = useCallback((template) => {
                setFreeTexts(prev => [...prev, {
                    id: Date.now(),

                    content: template.content
                }]);
            }, []);

            // Limpar apenas receita (medicamentos e textos livres)
            const handleClearContent = useCallback(() => {
                setMedications([{ id: Date.now(), route: 'Uso Oral', name: '', instructions: '', isControlled: false, hideDate: false, copies: 1 }]);
                setFreeTexts([]);
            }, []);

            // Limpar tudo (incluindo dados do paciente)
            const handleClearAll = useCallback(() => {
                setPatient({ name: '', cpf: '', address: '' });

                setFreeTexts([]);
            }, []);

            // Baixar PDF com jsPDF
            const handleDownloadPDF = useCallback(() => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pageWidth = 210;
                const margin = 20;

                printPages.forEach((page) => {

                    doc.text(`${doctor.specialty} | ${doctor.crm}`, pageWidth / 2, y, { align: 'center' });

                        doc.text(
                            page.via === 1 ? '1ª VIA - RETENÇÃO DA FARMÁCIA' : '2ª VIA - ORIENTAÇÃO AO PACIENTE',

                        y += 10;

                    // Paciente
                    doc.setFontSize(12);

                    if (patient.cpf) {

                    // Medicamentos
                    page.meds.forEach((med, idx) => {

                        doc.text(`${idx + 1}. ${med.name}`, margin + 4, y);

                        doc.text(med.route, margin + 12, y);
                        doc.setTextColor(0, 0, 0);
                        y += 5;
                        if (med.instructions) {

                            const instrLines = doc.splitTextToSize(med.instructions, contentWidth - 12);

                    // Texto livre

            return (

                                        🔐

                                    <button onClick={() => setShowDoctorSettings(!showDoctorSettings)}
                                        style={{ background: showDoctorSettings ? '#e8e8ed' : 'transparent', border: '1px solid transparent', borderRadius: '10px', padding: '6px', cursor: 'pointer', color: '#1d1d1f' }}

                                        borderRadius: '12px', fontSize: '12px',
                                        color: tipoReceitaAtual === 'A' ? '#78350f' : tipoReceitaAtual === 'B1' || tipoReceitaAtual === 'B2' ? '#1e3a8a' : '#374151'
                                    }}>
                                        <strong>
                                            {tipoReceitaAtual === 'A'  ? '🟡 Notificação de Receita A — Lista A2 (Amarela)' :
                                             tipoReceitaAtual === 'B1' ? '🔵 Notificação de Receita B1 — Lista B1 (Azul)' :
                                             tipoReceitaAtual === 'B2' ? '🔵 Notificação de Receita B2 (Azul)' :
                                                                          '⬜ Receituário de Controle Especial — Branca 2 vias'}
                                        </strong>
                                        {tipoReceitaAtual && ` — ${TIPO_RECEITA[tipoReceitaAtual].vias} via(s).`}
                                        {tipoReceitaAtual === 'C1' && ' Preencha os dados do comprador na receita.'}
                                    </div>
                                )}

                                {/* Configurações do Médico */}
                                {showDoctorSettings && (
                                    <div className="p-5 rounded-2xl space-y-4 mb-2" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>
                                        <h3 className="text-xs font-semibold uppercase" style={{ color: '#6e6e73', letterSpacing: '0.06em' }}>Dados do Prescritor</h3>
                                        <div>
                                            <label className="block text-xs mb-1.5" style={{ color: '#6e6e73' }}>Nome Completo</label>
                                            <input type="text" value={doctor.name} onChange={(e) => setDoctor({...doctor, name: e.target.value})} className="w-full text-sm p-2.5 rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs mb-1.5" style={{ color: '#6e6e73' }}>CRM e RQE</label>
                                                <input type="text" value={doctor.crm} onChange={(e) => setDoctor({...doctor, crm: e.target.value})} className="w-full text-sm p-2.5 rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }} />
                                            </div>
                                            <div>
                                                <label className="block text-xs mb-1.5" style={{ color: '#6e6e73' }}>Especialidade</label>
                                                <input type="text" value={doctor.specialty} onChange={(e) => setDoctor({...doctor, specialty: e.target.value})} className="w-full text-sm p-2.5 rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs mb-1.5" style={{ color: '#6e6e73' }}>Clínica de Atendimento</label>
                                            <select
                                                value={selectedClinicId}
                                                onChange={(e) => setSelectedClinicId(e.target.value)}
                                                className="w-full text-sm p-2.5 rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }}
                                            >
                                                <option value="ANDREY">Consultório Dr. Andrey Rocca</option>
                                                <option value="EIXO">EIXO Neurologia Especializada</option>
                                                <option value="NA">NA Neurologistas Associados</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs mb-1.5" style={{ color: '#6e6e73' }}>Cidade atual</label>
                                            <input type="text" value={city} onChange={(e) => setCity(e.target.value)} className="w-full text-sm p-2.5 rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }} />
                                        </div>
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                                <label className="block text-xs" style={{ color: '#6e6e73' }}>Assinatura Digital</label>
                                                <button
                                                    onClick={() => setShowSignaturePad(!showSignaturePad)}
                                                    className="text-xs px-3 py-1.5 rounded-xl transition-all"
                                                    style={{ background: showSignaturePad ? '#e8e8ed' : '#f5f5f7', color: '#0071e3', border: '1px solid #d2d2d7' }}
                                                >
                                                    {showSignaturePad ? 'Fechar' : signatureDataUrl ? 'Atualizar' : 'Assinar'}
                                                </button>
                                            </div>
                                            {showSignaturePad && (
                                                <SignaturePad
                                                    onSave={(dataUrl) => { setSignatureDataUrl(dataUrl); setShowSignaturePad(false); }}
                                                    onClear={() => setSignatureDataUrl(null)}
                                                    existingSignature={signatureDataUrl}
                                                />
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Paciente */}
                                <div>
                                    <h3 className="text-xs font-semibold uppercase mb-3" style={{ color: '#6e6e73', letterSpacing: '0.06em' }}>Paciente</h3>
                                    <div className="space-y-3">
                                        <input
                                            type="text"
                                            placeholder="Nome do Paciente"
                                            value={patient.name}
                                            onChange={(e) => setPatient({...patient, name: e.target.value})}
                                            className="w-full p-3 rounded-xl outline-none font-medium text-sm" style={{ border: '1px solid #d2d2d7', color: '#1d1d1f' }}
                                        />
                                        <input
                                            type="text"
                                            placeholder="CPF do Paciente"
                                            value={patient.cpf}
                                            onChange={(e) => setPatient({...patient, cpf: e.target.value})}
                                            className="w-full p-3 text-sm rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', color: '#1d1d1f' }}
                                        />
                                        <input
                                            type="text"
                                            placeholder="Endereço do Paciente (Para receitas controladas)"
                                            value={patient.address}
                                            onChange={(e) => setPatient({...patient, address: e.target.value})}
                                            className="w-full p-3 text-sm rounded-xl outline-none" style={{ border: '1px solid #d2d2d7', color: '#1d1d1f' }}
                                        />
                                    </div>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px solid #e8e8ed' }} />

                                {/* Templates / Kits de Acesso Rápido */}
                                <div>
                                    <h3 className="text-xs font-semibold uppercase mb-3" style={{ color: '#6e6e73', letterSpacing: '0.06em' }}>Acesso Rápido</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {TEMPLATE_KITS.map(tpl => (
                                            <button
                                                key={tpl.id}
                                                onClick={() => handleAddTemplate(tpl)}
                                                className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium transition-all"
                                                style={{ background: '#f5f5f7', border: '1px solid #e8e8ed', color: '#1d1d1f' }}
                                                onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(0,113,227,0.06)'; e.currentTarget.style.borderColor = '#0071e3'; e.currentTarget.style.color = '#0071e3'; }}
                                                onMouseLeave={(e) => { e.currentTarget.style.background = '#f5f5f7'; e.currentTarget.style.borderColor = '#e8e8ed'; e.currentTarget.style.color = '#1d1d1f'; }}
                                            >
                                                {tpl.icon === 'FileText' ? <Icons.FileText /> : <Icons.Clipboard />}
                                                {tpl.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px solid #e8e8ed' }} />

                                {/* Medicamentos */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-xs font-semibold uppercase" style={{ color: '#6e6e73', letterSpacing: '0.06em' }}>Prescrição</h3>
                                        <span className="text-xs" style={{ color: '#86868b' }}>
                                            {medications.filter(m => m.name.trim()).length} medicamento(s)
                                        </span>
                                    </div>

                                    {/* Busca Inteligente de Medicamentos */}
                                    <div className="mb-4">
                                        <MedicationSearch onSelect={handleAddFromSearch} />
                                    </div>

                                    {/* Opção de receita separada */}
                                    <label className="flex items-center gap-2 cursor-pointer p-2.5 rounded-xl mb-3 transition" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>
                                        <input
                                            type="checkbox"
                                            checked={separatePrescriptions}
                                            onChange={(e) => setSeparatePrescriptions(e.target.checked)}
                                            className="w-4 h-4 rounded cursor-pointer accent-blue-600"
                                        />
                                        <span className="text-xs font-medium select-none" style={{ color: '#1d1d1f' }}>
                                            Receita separada por medicamento
                                        </span>
                                    </label>

                                    <div className="space-y-3">
                                        {medications.map((med, index) => (
                                            <div key={med.id} className="relative group p-4 rounded-2xl transition-all" style={{ background: '#fff', border: '1px solid #e8e8ed', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                                                {/* Botões de ação */}
                                                <div className="absolute top-3 right-3 flex gap-1">
                                                    {index > 0 && (
                                                        <button
                                                            onClick={() => moveMedication(med.id, -1)}
                                                            className="p-1 rounded-lg transition-colors"
                                                            style={{ color: '#86868b' }}
                                                            title="Mover para cima"
                                                        >
                                                            <Icons.ChevronUp />
                                                        </button>
                                                    )}
                                                    {index < medications.length - 1 && (
                                                        <button
                                                            onClick={() => moveMedication(med.id, 1)}
                                                            className="p-1 rounded-lg transition-colors"
                                                            style={{ color: '#86868b' }}
                                                            title="Mover para baixo"
                                                        >
                                                            <Icons.ChevronDown />
                                                        </button>
                                                    )}
                                                    {medications.length > 1 && (
                                                        <button
                                                            onClick={() => removeMedication(med.id)}
                                                            className="p-1 rounded-lg transition-colors hover:text-red-500"
                                                            style={{ color: '#86868b' }}
                                                            title="Remover medicamento"
                                                        >
                                                            <Icons.Trash />
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="pr-16 space-y-3">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs font-semibold px-2 py-0.5 rounded-lg" style={{ color: '#6e6e73', background: '#f5f5f7' }}>
                                                            #{index + 1}
                                                        </span>
                                                        <select
                                                            value={med.route}
                                                            onChange={(e) => updateMedication(med.id, 'route', e.target.value)}
                                                            className="text-sm rounded-xl p-2 outline-none" style={{ border: '1px solid #d2d2d7', color: '#1d1d1f', background: '#fbfbfd' }}
                                                        >
                                                            <option>Uso Oral</option>
                                                            <option>Uso Tópico</option>
                                                            <option>Uso Injetável</option>
                                                            <option>Uso Nasal</option>
                                                            <option>Uso Oftálmico</option>
                                                            <option>Uso Contínuo</option>
                                                            <option>Uso Retal</option>
                                                            <option>Uso Sublingual</option>
                                                            <option>Uso Transdérmico</option>
                                                        </select>
                                                    </div>

                                                    <input
                                                        type="text"
                                                        placeholder="Medicamento e apresentação (Ex: Amoxicilina 500mg)"
                                                        value={med.name}
                                                        onChange={(e) => updateMedication(med.id, 'name', e.target.value)}
                                                        className="w-full p-2 outline-none font-semibold bg-transparent transition" style={{ borderBottom: '1px solid #d2d2d7', color: '#1d1d1f' }}
                                                    />

                                                    <textarea
                                                        placeholder="Posologia e orientações"
                                                        value={med.instructions}
                                                        onChange={(e) => updateMedication(med.id, 'instructions', e.target.value)}
                                                        rows="2"
                                                        className="w-full p-2.5 text-sm rounded-xl outline-none resize-none transition" style={{ border: '1px solid #e8e8ed', color: '#1d1d1f', background: '#fbfbfd' }}
                                                    ></textarea>

                                                    {/* Opções do Medicamento */}
                                                    <div className="flex flex-wrap gap-2 mt-2 pt-3" style={{ borderTop: '1px solid #f0f0f2' }}>
                                                        <label className="flex items-center gap-2 cursor-pointer p-2 rounded-xl transition flex-1 min-w-[130px]" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>
                                                            <input
                                                                type="checkbox"
                                                                checked={med.isControlled}
                                                                onChange={(e) => updateMedication(med.id, 'isControlled', e.target.checked)}
                                                                className="w-4 h-4 rounded cursor-pointer accent-blue-600"
                                                            />
                                                            <span className="text-xs font-medium select-none" style={{ color: '#1d1d1f' }}>
                                                                Controlado
                                                            </span>
                                                        </label>

                                                        <label className="flex items-center gap-2 cursor-pointer p-2 rounded-xl transition flex-1 min-w-[120px]" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>
                                                            <input
                                                                type="checkbox"
                                                                checked={med.hideDate}
                                                                onChange={(e) => updateMedication(med.id, 'hideDate', e.target.checked)}
                                                                className="w-4 h-4 rounded cursor-pointer accent-blue-600"
                                                            />
                                                            <span className="text-xs font-medium select-none" style={{ color: '#1d1d1f' }}>
                                                                Sem Data
                                                            </span>
                                                        </label>

                                                        <div className="flex items-center gap-2 px-3 py-2 rounded-xl flex-1 min-w-[120px] justify-between" style={{ background: '#f5f5f7', border: '1px solid #e8e8ed' }}>
                                                            <span className="text-xs font-medium" style={{ color: '#1d1d1f' }}>Vias/Cópias:</span>
                                                            <input
                                                                type="number"
                                                                min="1"
                                                                max="12"
                                                                value={med.copies}
                                                                onChange={(e) => updateMedication(med.id, 'copies', parseInt(e.target.value) || 1)}
                                                                className="w-12 p-1 text-center text-xs rounded-lg outline-none" style={{ border: '1px solid #d2d2d7', background: '#fff' }}
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <button
                                        onClick={addMedication}
                                        className="mt-4 w-full py-3 rounded-2xl font-medium transition-all flex items-center justify-center gap-2 text-sm"
                                        style={{ border: '2px dashed #d2d2d7', color: '#6e6e73', background: 'transparent' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#0071e3'; e.currentTarget.style.color = '#0071e3'; e.currentTarget.style.background = 'rgba(0,113,227,0.04)'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#d2d2d7'; e.currentTarget.style.color = '#6e6e73'; e.currentTarget.style.background = 'transparent'; }}
                                    >
                                        <Icons.Plus /> Adicionar Medicamento
                                    </button>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px solid #e8e8ed' }} />

                                {/* Texto Livre */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-xs font-semibold uppercase" style={{ color: '#6e6e73', letterSpacing: '0.06em' }}>Texto Livre</h3>
                                        <span className="text-xs" style={{ color: '#86868b' }}>
                                            {freeTexts.filter(ft => ft.content.trim()).length} bloco(s)
                                        </span>
                                    </div>

                                    <div className="space-y-3">
                                        {freeTexts.map((ft, index) => (
                                            <div key={ft.id} className="relative group p-4 rounded-2xl transition-all" style={{ background: '#fff', border: '1px solid #e8e8ed', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' }}>
                                                <div className="absolute top-3 right-3 flex gap-1">
                                                    <button
                                                        onClick={() => removeFreeText(ft.id)}
                                                        className="p-1 rounded-lg transition-colors hover:text-red-500"
                                                        style={{ color: '#86868b' }}
                                                        title="Remover texto livre"
                                                    >
                                                        <Icons.Trash />
                                                    </button>
                                                </div>

                                                <div className="pr-10 space-y-3">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs font-semibold px-2 py-0.5 rounded-lg" style={{ color: '#6e6e73', background: '#f5f5f7' }}>
                                                            <Icons.FileText />
                                                        </span>
                                                        <input
                                                            type="text"
                                                            placeholder="Título (Ex: Solicitação de Exame, Atestado...)"
                                                            value={ft.title}
                                                            onChange={(e) => updateFreeText(ft.id, 'title', e.target.value)}
                                                            className="w-full p-2 outline-none font-semibold bg-transparent transition text-sm" style={{ borderBottom: '1px solid #d2d2d7', color: '#1d1d1f' }}
                                                        />
                                                    </div>

                                                    <textarea
                                                        placeholder="Conteúdo do texto livre..."
                                                        value={ft.content}
                                                        onChange={(e) => updateFreeText(ft.id, 'content', e.target.value)}
                                                        rows="4"
                                                        className="w-full p-2.5 text-sm rounded-xl outline-none resize-none transition" style={{ border: '1px solid #e8e8ed', color: '#1d1d1f', background: '#fbfbfd' }}
                                                    ></textarea>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <button
                                        onClick={addFreeText}
                                        className="mt-4 w-full py-3 rounded-2xl font-medium transition-all flex items-center justify-center gap-2 text-sm"
                                        style={{ border: '2px dashed #d2d2d7', color: '#6e6e73', background: 'transparent' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#0071e3'; e.currentTarget.style.color = '#0071e3'; e.currentTarget.style.background = 'rgba(0,113,227,0.04)'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#d2d2d7'; e.currentTarget.style.color = '#6e6e73'; e.currentTarget.style.background = 'transparent'; }}
                                    >
                                        <Icons.FileText /> Adicionar Texto Livre
                                    </button>
                                </div>
                            </div>

                            {/* Footer de Ações */}
                            <div className="px-6 py-5 space-y-3" style={{ borderTop: '1px solid #d2d2d7', background: 'rgba(255,255,255,0.5)' }}>
                                <div className="text-xs text-center mb-1" style={{ color: '#86868b' }}>
                                    {printPages.length === 0
                                        ? 'Nenhuma página para imprimir'
                                        : `${printPages.length} página(s) para impressão`
                                    }
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={handleDownloadPDF}
                                        disabled={printPages.length === 0}
                                        className="apple-btn flex justify-center items-center gap-2"
                                        style={{ fontSize: '14px', fontWeight: '500', padding: '12px 16px' }}
                                    >
                                        <Icons.Download /> Baixar PDF
                                    </button>
                                    <button
                                        onClick={handlePrint}
                                        disabled={printPages.length === 0}
                                        className="apple-btn flex justify-center items-center gap-2"
                                        style={{ fontSize: '14px', fontWeight: '500', padding: '12px 16px' }}
                                    >
                                        <Icons.Printer /> Imprimir
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={handleClearContent}
                                        className="flex justify-center items-center gap-2 py-3 rounded-full font-medium transition-all text-sm"
                                        style={{ background: '#f5f5f7', color: '#6e6e73', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.background = '#f0f0f2'; e.currentTarget.style.borderColor = '#d2d2d7'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.background = '#f5f5f7'; e.currentTarget.style.borderColor = '#e8e8ed'; }}
                                    >
                                        <Icons.Eraser /> Limpar Receita
                                    </button>
                                    <button
                                        onClick={handleClearAll}
                                        className="flex justify-center items-center gap-2 py-3 rounded-full font-medium transition-all text-sm"
                                        style={{ background: '#f5f5f7', color: '#e34040', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.background = '#fef2f2'; e.currentTarget.style.borderColor = '#e34040'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.background = '#f5f5f7'; e.currentTarget.style.borderColor = '#e8e8ed'; }}
                                    >
                                        <Icons.Trash /> Limpar Tudo
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* COLUNA DIREITA: PREVIEW */}
                        <div className="flex-1 overflow-y-auto p-10 hide-scrollbar" style={{ background: '#f5f5f7' }}>
                            <div className="max-w-4xl mx-auto space-y-8">

                                <div className="p-4 rounded-2xl text-sm flex items-start gap-3" style={{ background: '#fbfbfd', border: '1px solid #d2d2d7', color: '#1d1d1f' }}>
                                    <div className="mt-0.5" style={{ fontSize: '16px' }}>ℹ️</div>
                                    <div>
                                        <p className="font-semibold" style={{ color: '#1d1d1f' }}>Lógica de Impressão Automática</p>
                                        <p style={{ color: '#6e6e73', marginTop: '2px' }}>As páginas abaixo refletem exatamente o que sairá na impressora. Medicamentos são agrupados por tipo (simples vs. controlado) e por presença de data. Medicamentos controlados geram 1ª e 2ª via automaticamente.</p>
                                    </div>
                                </div>

                                {pages.map((page) => (
                                    <div key={page.id}>
                                        {!page.isEmpty && (
                                            <h3 className="font-medium mb-3 text-center text-xs uppercase mt-8" style={{ color: '#86868b', letterSpacing: '0.06em' }}>
                                                {getPageLabel(page)}
                                            </h3>
                                        )}
                                        <PrescriptionPage
                                            meds={page.meds}
                                            freeTexts={page.freeTexts}
                                            isControlled={page.isControlled}
                                            tipoReceita={page.tipoReceita}
                                            via={page.via}
                                            hideDate={page.hideDate}
                                            doctor={doctor}
                                            clinic={clinic}
                                            city={city}
                                            patient={patient}
                                            forPrint={false}
                                            signatureDataUrl={signatureDataUrl}
                                            rxId={rxId}
                                            birdIdSigned={birdIdSigned}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Painel Histórico */}
                    {showHistory && (
                        <HistoryPanel
                            patient={patient}
                            onLoad={handleLoadFromHistory}
                            onClose={() => setShowHistory(false)}
                        />
                    )}

                    {/* ============================================ */}
                    {/* ÁREA DE IMPRESSÃO — invisível na tela,       */}
                    {/* visível somente em @media print               */}
                    {/* ============================================ */}
                    <div className="print-area">
                        {printPages.map(page => (
                            <PrescriptionPage
                                key={`print-${page.id}`}
                                meds={page.meds}
                                freeTexts={page.freeTexts}
                                isControlled={page.isControlled}
                                via={page.via}
                                hideDate={page.hideDate}
                                doctor={doctor}
                                clinic={clinic}
                                city={city}
                                patient={patient}
                                forPrint={true}
                                signatureDataUrl={signatureDataUrl}
                                tipoReceita={page.tipoReceita}
                                rxId={rxId}
                                birdIdSigned={birdIdSigned}
                            />
                        ))}
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
