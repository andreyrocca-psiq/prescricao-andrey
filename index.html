        const searchAnvisaMedications = (query) => {
            if (!query || query.length < 2) return [];

            // Retorna um por medicamento base (agrupa apresentações)

            const meds = medications.filter(m => m.name.trim());
            if (meds.length === 0 && freeTexts.filter(f => f.content.trim()).length === 0) return;
            all[key].prescriptions.unshift({
                id: Date.now(),

        // Helper: data formatada
        const formatDate = (hideDate) => {
            if (hideDate) return "_____ de ________________ de 20____";
            const date = new Date();
            const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        // ========================================

        const PrescriptionPage = ({ meds, freeTexts: pageFreeTexts, isControlled, via, hideDate, doctor, clinic, city, patient, forPrint, signatureDataUrl }) => {

                                    <h4 style={{ fontWeight: '600', textAlign: 'center', borderBottom: '1px solid #d2d2d7', paddingBottom: '4px', marginBottom: '8px', textTransform: 'uppercase', fontSize: '9px', letterSpacing: '0.04em' }}>Identificação do Fornecedor</h4>
                                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '1px solid #d2d2d7', marginBottom: '8px' }}>

        };

        // ========================================
        // Lógica de Geração de Páginas
        // ========================================
        const generatePages = (medications, freeTextBlocks, separatePrescriptions) => {
            const validMeds = medications.filter(m => m.name.trim() !== '');
            const validFreeTexts = (freeTextBlocks || []).filter(ft => ft.content.trim() !== '');
            const pages = [];

            if (validMeds.length === 0 && validFreeTexts.length === 0) {
                pages.push({
                    id: 'empty',
                    isControlled: false,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: [],
                    freeTexts: [],
                    isEmpty: true
                });
                return pages;
            }

            // Agrupa por: controlado/não-controlado × com data/sem data
            const groupKeys = [];
            validMeds.forEach(med => {
                const key = `${med.isControlled ? 'C' : 'N'}_${med.hideDate ? 'H' : 'D'}`;
                if (!groupKeys.includes(key)) groupKeys.push(key);
            });

            let pageIdCounter = 0;

            // Função para dividir array em chunks
            const chunkArray = (arr, size) => {
                const chunks = [];
                for (let i = 0; i < arr.length; i += size) {
                    chunks.push(arr.slice(i, i + size));
                }
                return chunks;
            };

            groupKeys.forEach(key => {
                const isControlled = key.startsWith('C');
                const hideDate = key.endsWith('H');

                const groupMeds = validMeds.filter(
                    m => m.isControlled === isControlled && m.hideDate === hideDate
                );

                if (groupMeds.length === 0) return;

                const maxCopies = Math.max(...groupMeds.map(m => Math.max(1, parseInt(m.copies) || 1)));

                for (let copyNum = 1; copyNum <= maxCopies; copyNum++) {
                    const medsForCopy = groupMeds.filter(m => (Math.max(1, parseInt(m.copies) || 1)) >= copyNum);
                    if (medsForCopy.length === 0) continue;

                    // Determina tamanho máximo por página
                    let maxPerPage;
                    if (separatePrescriptions) {
                        maxPerPage = 1;
                    } else if (isControlled) {
                        maxPerPage = 3;
                    } else {
                        maxPerPage = medsForCopy.length; // sem limite para simples
                    }

                    const chunks = chunkArray(medsForCopy, maxPerPage);

                    chunks.forEach(chunk => {
                        if (isControlled) {
                            pages.push({
                                id: `page-${pageIdCounter++}`,
                                isControlled: true,
                                hideDate,
                                via: 1,
                                copyIndex: copyNum,
                                totalCopies: maxCopies,
                                meds: chunk,
                                freeTexts: [],
                                isEmpty: false
                            });
                            pages.push({
                                id: `page-${pageIdCounter++}`,
                                isControlled: true,
                                hideDate,
                                via: 2,
                                copyIndex: copyNum,
                                totalCopies: maxCopies,
                                meds: chunk,
                                freeTexts: [],
                                isEmpty: false
                            });
                        } else {
                            pages.push({
                                id: `page-${pageIdCounter++}`,
                                isControlled: false,
                                hideDate,
                                via: null,
                                copyIndex: copyNum,
                                totalCopies: maxCopies,
                                meds: chunk,
                                freeTexts: [],
                                isEmpty: false
                            });
                        }
                    });
                }
            });

            // Cada texto livre em uma página separada
            validFreeTexts.forEach(ft => {
                pages.push({
                    id: `page-freetext-${pageIdCounter++}`,
                    isControlled: false,
                    hideDate: false,
                    via: null,
                    copyIndex: 1,
                    totalCopies: 1,
                    meds: [],
                    freeTexts: [ft],
                    isEmpty: false
                });
            });

            return pages;
        };

        // ========================================
        // Componente de Busca de Medicamento (Typeahead)
        // ========================================
        const MedicationSearch = ({ onSelect }) => {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const [selectedMedBase, setSelectedMedBase] = useState(null);
            const inputRef = React.useRef(null);
            const dropdownRef = React.useRef(null);

            useEffect(() => {
                if (query.length >= 2) {
                    const found = searchAnvisaMedications(query);
                    setResults(found);
                    setShowDropdown(found.length > 0);
                } else {
                    setResults([]);
                    setShowDropdown(false);
                    setSelectedMedBase(null);
                }
            }, [query]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target) &&
                        inputRef.current && !inputRef.current.contains(e.target)) {
                        setShowDropdown(false);
                        setSelectedMedBase(null);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSelectBase = (med) => {
                const apresentacoes = PSYCH_MEDICATIONS.find(m => m.id === med.baseId);
                if (apresentacoes && apresentacoes.apresentacoes.length === 1) {
                    onSelect({ ...med, apresentacao: apresentacoes.apresentacoes[0] });
                    setQuery(''); setResults([]); setShowDropdown(false); setSelectedMedBase(null);
                } else {
                    setSelectedMedBase(med);
                }
            };

            const handleSelectApresentacao = (med, ap) => {
                onSelect({ ...med, apresentacao: ap });
                setQuery(''); setResults([]); setShowDropdown(false); setSelectedMedBase(null);
            };

            const apList = selectedMedBase
                ? (PSYCH_MEDICATIONS.find(m => m.id === selectedMedBase.baseId) || {}).apresentacoes || []
                : [];

            return (
                <div style={{ position: 'relative' }}>
                    <div style={{ position: 'relative' }}>
                        <div style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#86868b' }}>
                            <Icons.Search />
                        </div>
                        <input
                            ref={inputRef}
                            type="text"
                            placeholder="Buscar medicamento psiquiátrico (mín. 2 letras)..."
                            value={query}
                            onChange={(e) => { setQuery(e.target.value); setSelectedMedBase(null); }}
                            onFocus={() => { if (results.length > 0) setShowDropdown(true); }}
                            className="w-full p-3 pl-10 rounded-xl outline-none text-sm"
                            style={{ border: '1px solid #d2d2d7', color: '#1d1d1f', background: '#fbfbfd' }}
                        />
                    </div>

        // ========================================
        // Componente de Assinatura Digital
        // ========================================
        const SignaturePad = ({ onSave, onClear, existingSignature }) => {
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [hasDrawn, setHasDrawn] = React.useState(false);
            const lastPosRef = React.useRef({ x: 0, y: 0 });

            const getPos = (e, canvas) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                if (e.touches) {
                    return {
                        x: (e.touches[0].clientX - rect.left) * scaleX,
                        y: (e.touches[0].clientY - rect.top) * scaleY
                    };
                }
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const canvas = canvasRef.current;
                const pos = getPos(e, canvas);
                lastPosRef.current = pos;
                setIsDrawing(true);
                setHasDrawn(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const pos = getPos(e, canvas);
                ctx.beginPath();
                ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#1d1d1f';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                lastPosRef.current = pos;
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const handleSave = () => {
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png');
                onSave(dataUrl);
            };

            const handleClear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setHasDrawn(false);
                onClear();
            };

            return (
                <div>
                    <div style={{ border: '1px solid #d2d2d7', borderRadius: '12px', overflow: 'hidden', background: '#fff', marginBottom: '8px' }}>
                        <canvas
                            ref={canvasRef}
                            width={480}
                            height={120}
                            style={{ display: 'block', width: '100%', height: '120px', cursor: 'crosshair', touchAction: 'none' }}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                        />
                    </div>
                    <div style={{ display: 'flex', gap: '8px' }}>
                        <button
                            onClick={handleSave}
                            disabled={!hasDrawn}
                            className="flex-1 py-2 rounded-xl text-xs font-medium transition-all"
                            style={{ background: hasDrawn ? '#0071e3' : '#d2d2d7', color: '#fff', border: 'none', cursor: hasDrawn ? 'pointer' : 'not-allowed' }}
                        >
                            Salvar Assinatura
                        </button>
                        <button
                            onClick={handleClear}
                            className="flex-1 py-2 rounded-xl text-xs font-medium transition-all"
                            style={{ background: '#f5f5f7', color: '#e34040', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                        >
                            Limpar
                        </button>
                    </div>
                    {existingSignature && (
                        <div style={{ marginTop: '8px', padding: '8px', background: '#f0fdf4', borderRadius: '8px', border: '1px solid #bbf7d0' }}>
                            <p style={{ fontSize: '11px', color: '#166534', fontWeight: '500' }}>✓ Assinatura digital salva</p>
                        </div>
                    )}
                </div>
            );
        };

        // ========================================
        // Componente Bird ID
        // ========================================
        const BirdIDPanel = ({ onSigned, onClose }) => {
            const [clientId, setClientId] = useState(() => localStorage.getItem('birdid_client_id') || '');
            const [status, setStatus] = useState('idle'); // idle | connecting | connected | error
            const [token, setToken] = useState(() => sessionStorage.getItem('birdid_token') || null);
            const [message, setMessage] = useState('');

            const REDIRECT_URI = window.location.origin + window.location.pathname;
            const AUTH_URL = 'https://auth.birdid.com.br/auth/realms/birdid-cloud/protocol/openid-connect/auth';

            // Verificar callback OAuth2
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                const state = params.get('state');
                const savedState = sessionStorage.getItem('birdid_state');
                const verifier = sessionStorage.getItem('birdid_verifier');
                if (code && state && state === savedState && verifier) {
                    setStatus('connecting');
                    const cid = localStorage.getItem('birdid_client_id') || '';
                    fetch('https://auth.birdid.com.br/auth/realms/birdid-cloud/protocol/openid-connect/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ grant_type:'authorization_code', client_id: cid, redirect_uri: REDIRECT_URI, code, code_verifier: verifier })
                    }).then(r => r.json()).then(data => {
                        if (data.access_token) {
                            sessionStorage.setItem('birdid_token', data.access_token);
                            setToken(data.access_token);
                            setStatus('connected');
                            setMessage('✓ Bird ID conectado com sucesso!');
                            // Limpar params da URL
                            window.history.replaceState({}, '', window.location.pathname);
                        } else {
                            setStatus('error');
                            setMessage('Falha ao obter token. Verifique o Client ID.');
                        }
                    }).catch(() => { setStatus('error'); setMessage('Erro de conexão com Bird ID.'); });
                    sessionStorage.removeItem('birdid_state');
                    sessionStorage.removeItem('birdid_verifier');
                }
            }, []);

            const generatePKCE = async () => {
                const array = new Uint8Array(32);
                crypto.getRandomValues(array);
                const verifier = btoa(String.fromCharCode(...array)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
                const encoder = new TextEncoder();
                const data = encoder.encode(verifier);
                const digest = await crypto.subtle.digest('SHA-256', data);
                const challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
                return { verifier, challenge };
            };

            const handleConnect = async () => {
                if (!clientId.trim()) { setMessage('Informe o Client ID do Bird ID.'); return; }
                localStorage.setItem('birdid_client_id', clientId);
                const { verifier, challenge } = await generatePKCE();
                const state = Math.random().toString(36).slice(2);
                sessionStorage.setItem('birdid_state', state);
                sessionStorage.setItem('birdid_verifier', verifier);
                const url = `${AUTH_URL}?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=openid&state=${state}&code_challenge=${challenge}&code_challenge_method=S256`;
                window.location.href = url;
            };

            const handleDisconnect = () => {
                sessionStorage.removeItem('birdid_token');
                setToken(null);
                setStatus('idle');
                setMessage('');
            };

            return (
                <div style={{ padding: '16px', background: '#f0f7ff', borderRadius: '14px', border: '1px solid #bfdbfe', marginTop: '8px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                        <p style={{ fontWeight: '600', fontSize: '13px', color: '#1e40af' }}>🔐 Assinatura Bird ID (ICP-Brasil)</p>
                        <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6e6e73', fontSize: '14px' }}>✕</button>
                    </div>
                    {token ? (
                        <div>
                            <p style={{ fontSize: '12px', color: '#166534', fontWeight: '600', marginBottom: '8px' }}>✓ Conectado ao Bird ID</p>
                            <button onClick={handleDisconnect} style={{ fontSize: '11px', color: '#e34040', background: 'none', border: '1px solid #e34040', borderRadius: '8px', padding: '4px 12px', cursor: 'pointer', marginRight: '8px' }}>Desconectar</button>
                            <button onClick={() => { onSigned(); onClose(); }} style={{ fontSize: '11px', color: '#fff', background: '#0071e3', border: 'none', borderRadius: '8px', padding: '4px 12px', cursor: 'pointer' }}>Assinar Documento</button>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            <p style={{ fontSize: '11px', color: '#374151' }}>Informe seu Client ID obtido em <strong>birdid.com.br</strong></p>
                            <input type="text" placeholder="Client ID" value={clientId} onChange={e => setClientId(e.target.value)}
                                style={{ fontSize: '12px', padding: '8px 10px', borderRadius: '8px', border: '1px solid #93c5fd', outline: 'none', background: '#fff' }} />
                            <button onClick={handleConnect} style={{ fontSize: '12px', fontWeight: '600', color: '#fff', background: '#1d4ed8', border: 'none', borderRadius: '8px', padding: '8px', cursor: 'pointer' }}>
                                Conectar com Bird ID →
                            </button>
                            {message && <p style={{ fontSize: '11px', color: status === 'error' ? '#e34040' : '#166534' }}>{message}</p>}
                        </div>
                    )}

                                    >
                                        <Icons.Printer /> Imprimir
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={handleClearContent}
                                        className="flex justify-center items-center gap-2 py-3 rounded-full font-medium transition-all text-sm"
                                        style={{ background: '#f5f5f7', color: '#6e6e73', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.background = '#f0f0f2'; e.currentTarget.style.borderColor = '#d2d2d7'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.background = '#f5f5f7'; e.currentTarget.style.borderColor = '#e8e8ed'; }}
                                    >
                                        <Icons.Eraser /> Limpar Receita
                                    </button>
                                    <button
                                        onClick={handleClearAll}
                                        className="flex justify-center items-center gap-2 py-3 rounded-full font-medium transition-all text-sm"
                                        style={{ background: '#f5f5f7', color: '#e34040', border: '1px solid #e8e8ed', cursor: 'pointer' }}
                                        onMouseEnter={(e) => { e.currentTarget.style.background = '#fef2f2'; e.currentTarget.style.borderColor = '#e34040'; }}
                                        onMouseLeave={(e) => { e.currentTarget.style.background = '#f5f5f7'; e.currentTarget.style.borderColor = '#e8e8ed'; }}
                                    >
                                        <Icons.Trash /> Limpar Tudo
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* COLUNA DIREITA: PREVIEW */}
                        <div className="flex-1 overflow-y-auto p-10 hide-scrollbar" style={{ background: '#f5f5f7' }}>
                            <div className="max-w-4xl mx-auto space-y-8">

                                <div className="p-4 rounded-2xl text-sm flex items-start gap-3" style={{ background: '#fbfbfd', border: '1px solid #d2d2d7', color: '#1d1d1f' }}>
                                    <div className="mt-0.5" style={{ fontSize: '16px' }}>ℹ️</div>
                                    <div>
                                        <p className="font-semibold" style={{ color: '#1d1d1f' }}>Lógica de Impressão Automática</p>
                                        <p style={{ color: '#6e6e73', marginTop: '2px' }}>As páginas abaixo refletem exatamente o que sairá na impressora. Medicamentos são agrupados por tipo (simples vs. controlado) e por presença de data. Medicamentos controlados geram 1ª e 2ª via automaticamente.</p>
                                    </div>
                                </div>

                                {pages.map((page) => (
                                    <div key={page.id}>
                                        {!page.isEmpty && (
                                            <h3 className="font-medium mb-3 text-center text-xs uppercase mt-8" style={{ color: '#86868b', letterSpacing: '0.06em' }}>
                                                {getPageLabel(page)}
                                            </h3>
                                        )}
                                        <PrescriptionPage
                                            meds={page.meds}
                                            freeTexts={page.freeTexts}
                                            isControlled={page.isControlled}
                                            via={page.via}
                                            hideDate={page.hideDate}
                                            doctor={doctor}
                                            clinic={clinic}
                                            city={city}
                                            patient={patient}
                                            forPrint={false}
                                            signatureDataUrl={signatureDataUrl}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Painel Histórico */}
                    {showHistory && (
                        <HistoryPanel
                            patient={patient}
                            onLoad={handleLoadFromHistory}
                            onClose={() => setShowHistory(false)}
                        />
                    )}

                    {/* ============================================ */}
                    {/* ÁREA DE IMPRESSÃO — invisível na tela,       */}
                    {/* visível somente em @media print               */}
                    {/* ============================================ */}
                    <div className="print-area">
                        {printPages.map(page => (
                            <PrescriptionPage
                                key={`print-${page.id}`}
                                meds={page.meds}
                                freeTexts={page.freeTexts}
                                isControlled={page.isControlled}
                                via={page.via}
                                hideDate={page.hideDate}
                                doctor={doctor}
                                clinic={clinic}
                                city={city}
                                patient={patient}
                                forPrint={true}
                                signatureDataUrl={signatureDataUrl}
                            />
                        ))}
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
